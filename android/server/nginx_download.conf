# 下行带宽测试：Nginx 大文件下载服务器配置示例
# 可放入 /etc/nginx/conf.d/ 作为独立 server，或合并进现有 server 块。

server {
    listen 80;
    server_name _;

    # 关键：关闭压缩，避免影响带宽测试结果
    gzip off;

    location /big.bin {
        root /var/www/html;   # 对应文件 /var/www/html/big.bin
        sendfile on;
        tcp_nopush on;
        add_header Cache-Control "no-store";
    }
}

# 生成测试文件 (5-10 GB，建议使用稀疏文件，秒级完成)：
#   Linux:  sudo truncate -s 10G /var/www/html/big.bin
#   Windows: fsutil file createnew C:\nginx\html\big.bin 10737418240
#
# 放行端口：
#   ufw allow 80/tcp        (Linux)
#   云厂商安全组入方向放行 80  (公网 VM)
